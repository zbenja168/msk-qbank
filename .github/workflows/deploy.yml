name: Deploy to GitHub Pages

on:
  push:
    branches: [main, decks]   # decks = generated Anki files, replaced each release

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # A cold checkout type-checks the whole project rather than resuming from
      # an incremental build, which needs more heap than Node's default.
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      # Anki decks live on the orphan `decks` branch (force-replaced each release,
      # so binaries never pile up in main's history); copy them into the site.
      - name: Add Anki decks
        run: |
          if git ls-remote --exit-code --heads origin decks >/dev/null; then
            git fetch --depth 1 origin decks
            mkdir -p dist/anki
            git archive FETCH_HEAD | tar -x -C dist/anki
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
